# Reproduces the testbed described in Section III of the paper:
# Client -> Nginx + ModSecurity v3 (OWASP CRS 3.3) -> OWASP Juice Shop
# The "ngrok tunnel" hop from the paper's cloud deployment is replaced here
# by the host's own loopback interface (port 8080) so anyone can run the
# same pipeline locally without needing a public tunnel.

services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: waf-lab-backend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - waf-lab

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf-lab-proxy
    restart: unless-stopped
    depends_on:
      - juice-shop
    environment:
      BACKEND: "http://juice-shop:3000"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "${MODSEC_RULE_ENGINE:-on}"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      MODSEC_AUDIT_LOG_PARTS: "ABIJDEFHZ"
      ANOMALY_INBOUND: "${ANOMALY_INBOUND:-5}"
      ANOMALY_OUTBOUND: "${ANOMALY_OUTBOUND:-4}"
      BLOCKING_PARANOIA: "${BLOCKING_PARANOIA:-1}"
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/custom-rules.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
    networks:
      - waf-lab

  # Baseline comparator with the WAF engine disabled, used to measure
  # ModSecurity's own overhead (Table VII / Fig. 10 in the paper).
  baseline:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf-lab-baseline
    restart: unless-stopped
    depends_on:
      - juice-shop
    environment:
      BACKEND: "http://juice-shop:3000"
      PORT: "8081"
      MODSEC_RULE_ENGINE: "Off"
    ports:
      - "8081:8081"
    networks:
      - waf-lab

networks:
  waf-lab:
    driver: bridge
