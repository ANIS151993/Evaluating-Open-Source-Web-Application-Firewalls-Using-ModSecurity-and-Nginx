# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
#
# Implements the "EXCLUDE" stage of the four-phase tuning workflow described
# in Section III-E of the paper (Fig. 6) and the rule contributors listed in
# Table V. Mounted over the CRS's own exclusion-example file so it loads
# automatically (see /etc/modsecurity.d/owasp-crs/rules/*.conf in setup.conf).
#
# Toggle cycles by commenting/uncommenting blocks below, then
# `docker compose restart waf` and re-run the traffic replay.

# --- Cycle 1: URI-scoped exclusion for Rule 930100 (restricted file
# extensions / path-traversal-looking static asset names) -----------------
# Table V: 2,387 false positives (38.5% of baseline FPs) traced to static
# assets under /static/ and /assets/ being flagged by 930100.
SecRule REQUEST_URI "@beginsWith /static/" \
    "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveById=930100"
SecRule REQUEST_URI "@beginsWith /assets/" \
    "id:1000002,phase:1,pass,nolog,ctl:ruleRemoveById=930100"

# --- Cycle 3: parameter-scoped exclusion -----------------------------------
# Free-text review/comment bodies legitimately contain words the XSS
# heuristics (941100) flag (e.g. "<3 this product", quoted HTML snippets in
# support tickets). Scope the exclusion to the specific fields rather than
# disabling the rule globally, per Section III-E Stage 3.
SecRule REQUEST_URI "@beginsWith /rest/products/reviews" \
    "id:1000003,phase:2,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:message"

SecRule REQUEST_URI "@beginsWith /api/Feedbacks" \
    "id:1000004,phase:2,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:comment"
